<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 COLORS!!!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            color: white;

            background: rgb(255, 0, 0);

            transition: background-color 0.05s linear;
        }

        /* 背景のキラキラ */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;

            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255,255,255,0.12) 0deg 10deg,
                    transparent 10deg 20deg
                );

            animation: rotate 20s linear infinite;

            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;

            text-align: center;

            transform: rotate(-3deg);
        }

        .small {
            font-size: clamp(1rem, 3vw, 2rem);
            letter-spacing: 0.3em;

            text-shadow:
                3px 3px 0 #000,
                0 0 10px white;
        }

        h1 {
            margin: 0;

            font-size: clamp(4rem, 15vw, 12rem);
            line-height: 0.9;

            letter-spacing: -0.05em;

            color: white;

            -webkit-text-stroke: 5px black;

            text-shadow:
                8px 8px 0 #ff00ff,
                14px 14px 0 #00ffff,
                20px 20px 0 rgba(0, 0, 0, 0.5);

            animation: shake 0.8s infinite alternate;
        }

        .rainbow {
            margin-top: 2rem;

            font-size: clamp(1.2rem, 4vw, 2.5rem);
            letter-spacing: 0.15em;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 300% 100%;

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: rainbow 2s linear infinite;

            -webkit-text-stroke: 1px white;
        }

        .sparkle {
            position: fixed;

            font-size: 2rem;

            animation:
                float 3s ease-in-out infinite,
                spin 4s linear infinite;

            pointer-events: none;
        }

        .s1 {
            top: 10%;
            left: 12%;
        }

        .s2 {
            top: 20%;
            right: 15%;
            animation-delay: -1s;
        }

        .s3 {
            bottom: 15%;
            left: 20%;
            animation-delay: -2s;
        }

        .s4 {
            bottom: 10%;
            right: 12%;
            animation-delay: -0.5s;
        }

        @keyframes rainbow {
            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 300% 50%;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shake {
            from {
                transform: translate(-2px, -2px) rotate(-1deg);
            }

            to {
                transform: translate(2px, 2px) rotate(1deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-25px) scale(1.3);
            }
        }

        @keyframes spin {
            from {
                rotate: 0deg;
            }

            to {
                rotate: 360deg;
            }
        }
    </style>
</head>

<body>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">★</div>
    <div class="sparkle s3">✧</div>
    <div class="sparkle s4">★</div>

    <div class="container">
        <div class="small">WELCOME TO</div>

        <h1>7 COLORS!!!</h1>

        <div class="rainbow">
            🌈 LET'S GO!!! 🌈
        </div>
    </div>

    <script>
        const colors = [
            [255,   0,   0], // 赤
            [255, 165,   0], // 橙
            [255, 255,   0], // 黄
            [  0, 200,   0], // 緑
            [  0, 220, 255], // 水色
            [  0,  80, 255], // 青
            [160,   0, 255]  // 紫
        ];

        const duration = 10000;

        function interpolateColor(a, b, t) {
            return [
                Math.round(a[0] + (b[0] - a[0]) * t),
                Math.round(a[1] + (b[1] - a[1]) * t),
                Math.round(a[2] + (b[2] - a[2]) * t)
            ];
        }

        function update(time) {
            const progress = (time % duration) / duration;

            const position = progress * colors.length;

            const index = Math.floor(position);
            const t = position - index;

            const color1 = colors[index % colors.length];
            const color2 = colors[(index + 1) % colors.length];

            const color = interpolateColor(color1, color2, t);

            document.body.style.backgroundColor =
                `rgb(${color[0]}, ${color[1]}, ${color[2]})`;

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>

</body>
</html>
